<!DOCTYPE html>
<head>
   <title>Build An Order Summary</title>
   <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="main-pop-up">
        <img src="Music.png" alt="An animated picture">
        <div class="the-text">
            <h3>Order Summary</h3>
            <p>You can now listen to millions of songs, audiobooks and podcasts on any device anywhere you like!</p>
            <div class="the-price-section">
                <div>
                    <p>Annual Plan</p>
                    <p>$59.99/year</p>
                </div>
                <div class="the-link">
                    <a href="Music.png">Change</a>
                </div>
            </div>
            <button>Proceed to Payment</button>
        </div>
    </div>
</body>
</html>
